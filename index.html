<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>學生匯報隨機分組與抽籤</title>
  <style>
    /* ==========================================================================
       1. 設計系統與色彩變數 (Zero-Dependency 現代教育科技深藍與琥珀金主題)
       ========================================================================== */
    :root {
      --bg-page: #f1f5f9;
      --bg-card: #ffffff;
      --bg-subtle: #f8fafc;
      --bg-muted: #e2e8f0;
      --navy-950: #090d16;
      --navy-900: #0f172a;
      --navy-800: #1e293b;
      --indigo-900: #1e1b4b;
      --indigo-700: #4338ca;
      --indigo-600: #4f46e5;
      --indigo-100: #e0e7ff;
      --indigo-50: #eef2ff;
      --amber-500: #f59e0b;
      --amber-400: #fbbf24;
      --amber-100: #fef3c7;
      --amber-50: #fffbeb;
      --emerald-600: #059669;
      --emerald-50: #ecfdf5;
      --rose-600: #e11d48;
      --rose-50: #fff1f2;
      --text-main: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
      --border-light: #e2e8f0;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 12px 28px rgba(15, 23, 42, 0.14);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* ==========================================================================
       2. 頂部導覽列 (Header)
       ========================================================================== */
    .app-header {
      background: linear-gradient(135deg, var(--navy-900) 0%, var(--indigo-900) 55%, var(--navy-800) 100%);
      color: #ffffff;
      padding: 14px 20px;
      position: sticky;
      top: 0;
      z-index: 40;
      box-shadow: 0 4px 16px rgba(9, 13, 22, 0.25);
    }

    .header-inner {
      max-width: 1360px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--amber-400), var(--amber-500));
      color: var(--navy-950);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 900;
      box-shadow: 0 4px 10px rgba(245, 158, 11, 0.35);
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .brand-badge {
      font-size: 0.72rem;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.12);
      color: #e0e7ff;
      padding: 2px 9px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .brand-sub {
      font-size: 0.78rem;
      color: #cbd5e1;
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    /* ==========================================================================
       3. 按鈕與表單元件通用樣式
       ========================================================================== */
    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      outline: none;
      transition: all 0.18s ease;
    }

    button:active {
      transform: scale(0.97);
    }

    .btn-header {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 13px;
      border-radius: 10px;
      font-size: 0.83rem;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.1);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    .btn-header:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .btn-header.sound-active {
      background: rgba(245, 158, 11, 0.22);
      color: #fde68a;
      border-color: rgba(251, 191, 36, 0.5);
    }

    .btn-header.sound-muted {
      background: rgba(15, 23, 42, 0.6);
      color: #94a3b8;
      border-color: rgba(148, 163, 184, 0.3);
    }

    .btn-primary-draw {
      width: 100%;
      padding: 16px 20px;
      border-radius: var(--radius-lg);
      background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 55%, #d97706 100%);
      color: var(--navy-950);
      font-size: 1.12rem;
      font-weight: 900;
      letter-spacing: 0.03em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 8px 20px rgba(245, 158, 11, 0.35);
      animation: drawPulse 2.4s infinite;
    }

    .btn-primary-draw:hover:not(:disabled) {
      filter: brightness(1.05);
      transform: translateY(-1px);
    }

    .btn-primary-draw:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      animation: none;
    }

    @keyframes drawPulse {
      0%, 100% { box-shadow: 0 8px 20px rgba(245, 158, 11, 0.35), 0 0 0 0 rgba(245, 158, 11, 0.45); }
      50% { box-shadow: 0 8px 20px rgba(245, 158, 11, 0.35), 0 0 0 10px rgba(245, 158, 11, 0); }
    }

    /* ==========================================================================
       4. 主排版結構 (雙欄響應式配置)
       ========================================================================== */
    .main-container {
      flex: 1;
      max-width: 1360px;
      width: 100%;
      margin: 0 auto;
      padding: 22px 20px 40px;
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }

    .settings-sidebar {
      width: 410px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .settings-sidebar.hidden {
      display: none !important;
    }

    .results-workspace {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    @media (max-width: 960px) {
      .main-container {
        flex-direction: column;
      }
      .settings-sidebar {
        width: 100%;
      }
    }

    /* ==========================================================================
       5. 設定卡片與表單控制項
       ========================================================================== */
    .card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-sm);
      padding: 18px 20px;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 8px;
    }

    .card-title {
      font-size: 0.98rem;
      font-weight: 800;
      color: var(--navy-900);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .step-badge {
      width: 24px;
      height: 24px;
      border-radius: 7px;
      background: var(--navy-900);
      color: #ffffff;
      font-size: 0.78rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .mode-pill {
      font-size: 0.74rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--indigo-50);
      color: var(--indigo-700);
      border: 1px solid var(--indigo-100);
    }

    .form-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    .form-label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .stepper-group {
      display: flex;
      align-items: stretch;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      overflow: hidden;
      background: #ffffff;
    }

    .stepper-btn {
      width: 38px;
      background: var(--bg-subtle);
      color: var(--navy-900);
      font-size: 1.1rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stepper-btn:hover {
      background: var(--bg-muted);
    }

    .stepper-input {
      width: 100%;
      border: none;
      border-left: 1px solid var(--border-light);
      border-right: 1px solid var(--border-light);
      text-align: center;
      font-size: 0.98rem;
      font-weight: 800;
      color: var(--navy-900);
      padding: 8px 4px;
      outline: none;
    }

    .select-control, .input-control {
      width: 100%;
      padding: 8px 11px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: #ffffff;
      font-size: 0.86rem;
      font-weight: 600;
      color: var(--navy-900);
      outline: none;
    }

    .select-control:focus, .input-control:focus, .textarea-control:focus {
      border-color: var(--indigo-600);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.14);
    }

    .cap-box {
      background: var(--amber-50);
      border: 1px solid #fde68a;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 14px;
    }

    .cap-box.hidden {
      display: none;
    }

    .cap-hint {
      font-size: 0.73rem;
      color: #92400e;
      margin-top: 6px;
    }

    /* 每日日期設定列表 */
    .day-dates-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 200px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .day-date-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-subtle);
      padding: 6px 8px;
      border-radius: 10px;
      border: 1px solid var(--border-light);
    }

    .day-tag {
      font-size: 0.76rem;
      font-weight: 800;
      color: var(--indigo-700);
      background: var(--indigo-100);
      padding: 4px 9px;
      border-radius: 7px;
      white-space: nowrap;
      min-width: 62px;
      text-align: center;
    }

    /* 學生名單輸入區 */
    .mini-actions {
      display: flex;
      gap: 6px;
    }

    .btn-mini {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 8px;
    }

    .btn-mini-indigo {
      background: var(--indigo-50);
      color: var(--indigo-700);
      border: 1px solid var(--indigo-100);
    }

    .btn-mini-indigo:hover {
      background: var(--indigo-100);
    }

    .btn-mini-gray {
      background: var(--bg-subtle);
      color: var(--text-secondary);
      border: 1px solid var(--border-light);
    }

    .btn-mini-gray:hover {
      background: var(--rose-50);
      color: var(--rose-600);
      border-color: #fecdd3;
    }

    .textarea-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.76rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .count-badge {
      background: var(--indigo-50);
      color: var(--indigo-700);
      font-weight: 800;
      padding: 2px 9px;
      border-radius: 6px;
    }

    .textarea-control {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      background: var(--bg-subtle);
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--navy-900);
      line-height: 1.55;
      resize: vertical;
      outline: none;
    }

    .textarea-control:focus {
      background: #ffffff;
    }

    /* 預先手動鎖定區域 */
    .preassign-section {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px dashed var(--border-color);
    }

    .preassign-section.hidden {
      display: none;
    }

    .preassign-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .preassign-title {
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--navy-800);
    }

    .locked-counter {
      font-size: 0.73rem;
      font-weight: 700;
      color: #b45309;
      background: var(--amber-100);
      padding: 2px 9px;
      border-radius: 999px;
    }

    .preassign-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 240px;
      overflow-y: auto;
      padding-right: 3px;
    }

    .preassign-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 9px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-light);
      font-size: 0.85rem;
    }

    .preassign-row.is-locked {
      background: var(--amber-50);
      border-color: #fcd34d;
    }

    .stu-index {
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 700;
      min-width: 24px;
    }

    .stu-name-label {
      font-weight: 700;
      color: var(--navy-900);
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .lock-select {
      padding: 4px 8px;
      border-radius: 7px;
      border: 1px solid var(--border-color);
      font-size: 0.78rem;
      font-weight: 700;
      background: #ffffff;
      color: var(--navy-800);
    }

    .preassign-row.is-locked .lock-select {
      border-color: var(--amber-500);
      color: #92400e;
      background: #fffbeb;
    }

    /* ==========================================================================
       6. 右側工作區：頂部工具列、抽籤舞台、結果卡片網格
       ========================================================================== */
    .toolbar-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-sm);
      padding: 15px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .toolbar-title-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .accent-bar {
      width: 6px;
      height: 34px;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--indigo-600), var(--amber-500));
    }

    .toolbar-title {
      font-size: 1.08rem;
      font-weight: 800;
      color: var(--navy-900);
    }

    .toolbar-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .toolbar-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .toolbar-buttons.hidden {
      display: none;
    }

    .btn-tool {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 14px;
      border-radius: 10px;
      font-size: 0.84rem;
      font-weight: 700;
      box-shadow: var(--shadow-sm);
    }

    .btn-tool-amber {
      background: var(--amber-400);
      color: var(--navy-950);
    }
    .btn-tool-amber:hover { background: var(--amber-500); }

    .btn-tool-navy {
      background: var(--navy-900);
      color: #ffffff;
    }
    .btn-tool-navy:hover { background: var(--navy-800); }

    .btn-tool-emerald {
      background: var(--emerald-600);
      color: #ffffff;
    }
    .btn-tool-emerald:hover { background: #047857; }

    /* 抽籤緊張舞台 (Lottery Stage) */
    .lottery-stage {
      background: radial-gradient(circle at top right, #1e1b4b 0%, #0f172a 55%, #090d16 100%);
      color: #ffffff;
      border-radius: 24px;
      padding: 44px 24px;
      text-align: center;
      border: 2px solid rgba(251, 191, 36, 0.55);
      box-shadow: 0 20px 50px rgba(9, 13, 22, 0.35), 0 0 30px rgba(245, 158, 11, 0.2);
      min-height: 430px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .lottery-stage.hidden {
      display: none;
    }

    .stage-phase-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(245, 158, 11, 0.18);
      border: 1px solid rgba(251, 191, 36, 0.45);
      color: #fde68a;
      padding: 7px 18px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 800;
      margin-bottom: 24px;
    }

    .spinner-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--amber-400);
      animation: blinkDot 0.6s infinite alternate;
    }

    @keyframes blinkDot {
      from { opacity: 0.3; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1.25); }
    }

    .slot-box {
      width: 100%;
      max-width: 520px;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(251, 191, 36, 0.7);
      border-radius: 20px;
      padding: 34px 20px;
      margin-bottom: 26px;
      box-shadow: inset 0 0 24px rgba(0, 0, 0, 0.35);
      transition: transform 0.15s ease, border-color 0.2s ease, background 0.2s ease;
    }

    .slot-box.final-tension {
      background: rgba(225, 29, 72, 0.22);
      border-color: #fde047;
      transform: scale(1.03);
      box-shadow: 0 0 35px rgba(251, 191, 36, 0.45), inset 0 0 24px rgba(225, 29, 72, 0.3);
    }

    .slot-name {
      font-size: clamp(2.1rem, 5vw, 3.3rem);
      font-weight: 900;
      letter-spacing: 0.06em;
      color: #ffffff;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
    }

    .slot-name.pop {
      animation: nameBounce 0.16s ease-out;
    }

    @keyframes nameBounce {
      0% { transform: scale(1.09); }
      100% { transform: scale(1); }
    }

    .slot-sub {
      margin-top: 10px;
      font-size: 0.92rem;
      font-weight: 600;
      color: #fde68a;
    }

    .progress-wrapper {
      width: 100%;
      max-width: 520px;
    }

    .progress-track {
      width: 100%;
      height: 14px;
      background: rgba(15, 23, 42, 0.85);
      border-radius: 999px;
      padding: 2px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #6366f1 0%, #f59e0b 55%, #f43f5e 100%);
      transition: width 0.08s linear;
    }

    .progress-labels {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .progress-hint { color: #c7d2fe; }
    .progress-pct { color: #fbbf24; font-size: 0.9rem; }

    /* 抽籤結果卡片網格 */
    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 18px;
    }

    .results-grid.hidden {
      display: none;
    }

    .day-card {
      background: var(--bg-card);
      border-radius: 18px;
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      animation: cardReveal 0.42s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes cardReveal {
      from { opacity: 0; transform: translateY(16px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .day-card-header {
      background: linear-gradient(135deg, var(--navy-900), var(--indigo-900));
      color: #ffffff;
      padding: 14px 16px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .day-card-title {
      font-size: 1.02rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .day-card-date {
      font-size: 0.8rem;
      color: #cbd5e1;
      margin-top: 3px;
    }

    .day-card-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .day-count-pill {
      background: rgba(251, 191, 36, 0.2);
      color: #fde68a;
      border: 1px solid rgba(251, 191, 36, 0.4);
      font-size: 0.75rem;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 999px;
    }

    .btn-reshuffle-day {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-reshuffle-day:hover {
      background: var(--amber-500);
      color: var(--navy-950);
      border-color: var(--amber-500);
    }

    .student-order-list {

  <script>
    (function () {
      "use strict";

      // ==========================================================================
      // 1. 預設香港學生示例名單 (24人)
      // ==========================================================================
      const SAMPLE_STUDENTS = [
        "陳大文", "李嘉欣", "張偉明", "黃芷晴", "王俊傑", "林思敏",
        "劉子軒", "吳佩珊", "周浩然", "鄭凱琳", "梁家豪", "謝曉彤",
        "徐子健", "孫美玲", "朱啟聰", "胡靜雯", "郭志強", "何嘉怡",
        "高天朗", "羅心怡", "曾柏豪", "彭詠詩", "蕭卓軒", "葉敏儀"
      ];

      // ==========================================================================
      // 2. 應用程式狀態 (State)
      // ==========================================================================
      const state = {
        daysCount: 3,
        dayDates: [],
        students: [], // { id: string, name: string, lockedDay: number | null }
        schedule: [], // Array<Array<{ id, name, lockedDay }>>
        soundEnabled: true,
        isSidebarHidden: false,
        isDrawing: false
      };

      let drawTimerId = null;
      let toastTimerId = null;

      // ==========================================================================
      // 3. 經典 8-Bit 街機 / 紅白機打機音效合成器 (Retro Arcade & Game Sound Engine)
      // ==========================================================================
      class SafeSoundEngine {
        constructor() {
          this.ctx = null;
          this.tickStep = 0;
        }

        ensureContext() {
          try {
            if (!this.ctx) {
              const AudioCtx = window.AudioContext || window.webkitAudioContext;
              if (AudioCtx) {
                this.ctx = new AudioCtx();
              }
            }
            if (this.ctx && this.ctx.state === "suspended") {
              this.ctx.resume().catch(() => {});
            }
            return Boolean(this.ctx);
          } catch (err) {
            return false;
          }
        }

        // 啟動抽籤時重置 8-bit 音階步進器，並播放街機「投幣啟動」雙音
        startTensionPad(durationSec) {
          this.tickStep = 0;
          if (!state.soundEnabled) return;
          try {
            if (!this.ensureContext()) return;
            const now = this.ctx.currentTime;
            // 街機開始抽獎提示音 (G4 -> C5)
            this.play8BitTone(392.00, now, 0.055, "square", 0.08);
            this.play8BitTone(523.25, now + 0.055, 0.08, "square", 0.09);
          } catch (err) {
            // 靜默忽略音效權限限制
          }
        }

        stopTensionPad() {
          // 8-bit 音效皆為短促顆粒音，無需關閉持續長音，彻底消除低頻嗡嗡雜音
          this.tickStep = 0;
        }

        // 底層 8-bit 晶片音色產生器 (過濾高頻毛刺的方波 / 三角波)
        play8BitTone(freq, startTime, duration, waveType = "square", volume = 0.09, slideToFreq = null) {
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const filter = this.ctx.createBiquadFilter();
          const gain = this.ctx.createGain();

          osc.type = waveType;
          osc.frequency.setValueAtTime(freq, startTime);
          if (slideToFreq) {
            osc.frequency.setValueAtTime(slideToFreq, startTime + duration * 0.45);
          }

          // 低通濾波器讓 8-bit 方波保持清脆爽快但絕不刺耳
          filter.type = "lowpass";
          filter.frequency.setValueAtTime(2400, startTime);

          gain.gain.setValueAtTime(0.0001, startTime);
          gain.gain.linearRampToValueAtTime(volume, startTime + 0.004);
          gain.gain.setValueAtTime(volume * 0.85, startTime + duration * 0.65);
          gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(startTime);
          osc.stop(startTime + duration + 0.01);
        }

        // 經典《Mario Kart》道具箱轉盤跳格音 + 最後倒數雙音鎖定聲
        playTick(progress, isFinalCountdown) {
          if (!state.soundEnabled) return;
          try {
            if (!this.ensureContext()) return;
            const now = this.ctx.currentTime;

            if (isFinalCountdown) {
              // 最後慢動作倒數：清脆的 8-bit 雙音鎖定聲 (Octave Jump Blip: G5 -> G6)
              this.play8BitTone(783.99, now, 0.045, "square", 0.11);
              this.play8BitTone(1567.98, now + 0.045, 0.075, "square", 0.12);
            } else {
              // 高速與中速洗牌：經典五聲音階循環跳格 + 隨抽籤進度微幅升調
              const arpNotes = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50]; // C5, D5, E5, G5, A5, C6
              const baseNote = arpNotes[this.tickStep % arpNotes.length];
              this.tickStep++;

              // 隨進度微調音高 (1.0x -> 1.25x)，營造街機轉盤緊張感
              const pitchShift = 1 + progress * 0.25;
              const freq = baseNote * pitchShift;

              this.play8BitTone(freq, now, 0.042, "square", 0.085);
            }
          } catch (err) {
            // 忽略
          }
        }

        // 結果揭曉：經典紅白機破關勝利短曲 (Level Clear Fanfare: C5-E5-G5-C6-G5-C6)
        playRevealFanfare() {
          if (!state.soundEnabled) return;
          try {
            this.stopTensionPad();
            if (!this.ensureContext()) return;
            const now = this.ctx.currentTime;

            // 經典街機過關旋律與節奏
            const melody = [
              { freq: 523.25, bass: 261.63, delay: 0.00, dur: 0.085 }, // C5
              { freq: 659.25, bass: 329.63, delay: 0.09, dur: 0.085 }, // E5
              { freq: 783.99, bass: 392.00, delay: 0.18, dur: 0.085 }, // G5
              { freq: 1046.50, bass: 523.25, delay: 0.27, dur: 0.17 }, // C6
              { freq: 783.99, bass: 392.00, delay: 0.46, dur: 0.11 }, // G5
              { freq: 1046.50, bass: 523.25, delay: 0.59, dur: 0.42 }  // C6 (勝利長音)
            ];

            melody.forEach((note) => {
              const t = now + note.delay;
              // 主旋律 (8-bit 方波)
              this.play8BitTone(note.freq, t, note.dur, "square", 0.11);
              // 低八度三角波伴奏，讓破關音樂更飽滿厚實
              this.play8BitTone(note.bass, t, note.dur, "triangle", 0.14);
            });
          } catch (err) {
            // 忽略
          }
        }

        // 單日重洗與「🔔 試音」按鈕：經典瑪利歐吃金幣音效 (B5 -> E6)
        playQuickShuffle() {
          if (!state.soundEnabled) return;
          try {
            if (!this.ensureContext()) return;
            const now = this.ctx.currentTime;
            // B5 (987.77 Hz) 瞬間跳至 E6 (1318.51 Hz) 的經典金幣聲
            this.play8BitTone(987.77, now, 0.075, "square", 0.10);
            this.play8BitTone(1318.51, now + 0.075, 0.32, "square", 0.11);
          } catch (err) {
            // 忽略
          }
        }
      }

      const soundEngine = new SafeSoundEngine();

      // ==========================================================================
      // 4. DOM 參照快取
      // ==========================================================================
      const el = {
        soundToggleBtn: document.getElementById("soundToggleBtn"),
        soundIcon: document.getElementById("soundIcon"),
        soundLabel: document.getElementById("soundLabel"),
        toggleSidebarBtn: document.getElementById("toggleSidebarBtn"),
        sidebarToggleText: document.getElementById("sidebarToggleText"),
        settingsSidebar: document.getElementById("settingsSidebar"),

        daysCountInput: document.getElementById("daysCountInput"),
        decDaysBtn: document.getElementById("decDaysBtn"),
        incDaysBtn: document.getElementById("incDaysBtn"),
        modeBadge: document.getElementById("modeBadge"),
        distributionMode: document.getElementById("distributionMode"),
        maxCapBox: document.getElementById("maxCapBox"),
        maxPerDayInput: document.getElementById("maxPerDayInput"),
        dayDatesContainer: document.getElementById("dayDatesContainer"),

        loadSampleBtn: document.getElementById("loadSampleBtn"),
        clearStudentsBtn: document.getElementById("clearStudentsBtn"),
        totalStudentCount: document.getElementById("totalStudentCount"),
        studentInput: document.getElementById("studentInput"),
        preAssignSection: document.getElementById("preAssignSection"),
        lockedCountBadge: document.getElementById("lockedCountBadge"),
        preAssignList: document.getElementById("preAssignList"),

        startDrawBtn: document.getElementById("startDrawBtn"),
        resultSubtitle: document.getElementById("resultSubtitle"),
        resultActionBtns: document.getElementById("resultActionBtns"),
        redrawAllBtn: document.getElementById("redrawAllBtn"),
        copyResultsBtn: document.getElementById("copyResultsBtn"),
        exportCsvBtn: document.getElementById("exportCsvBtn"),

        emptyStateBox: document.getElementById("emptyStateBox"),
        quickDemoBtn: document.getElementById("quickDemoBtn"),
        lotteryStage: document.getElementById("lotteryStage"),
        stagePhaseText: document.getElementById("stagePhaseText"),
        slotBox: document.getElementById("slotBox"),
        slotNameDisplay: document.getElementById("slotNameDisplay"),
        slotSubDisplay: document.getElementById("slotSubDisplay"),
        progressFill: document.getElementById("progressFill"),
        progressHint: document.getElementById("progressHint"),
        progressPct: document.getElementById("progressPct"),
        resultsGrid: document.getElementById("resultsGrid"),

        toastBox: document.getElementById("toastBox"),
        toastIcon: document.getElementById("toastIcon"),
        toastText: document.getElementById("toastText")
      };

      // ==========================================================================
      // 5. 工具函式 (洗牌、日期生成、Toast 提示)
      // ==========================================================================
      function shuffleArray(arr) {
        const copy = arr.slice();
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const temp = copy[i];
          copy[i] = copy[j];
          copy[j] = temp;
        }
        return copy;
      }

      function generateDefaultDateLabel(dayIndex) {
        const date = new Date();
        // 預設以隔日開始，每兩日一堂課作為親切範例
        date.setDate(date.getDate() + 1 + dayIndex * 2);
        const yyyy = date.getFullYear();
        const mm = String(date.getMonth() + 1).padStart(2, "0");
        const dd = String(date.getDate()).padStart(2, "0");
        const weekdays = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];
        return `${yyyy}-${mm}-${dd} (${weekdays[date.getDay()]})`;
      }

      function showToast(message, icon = "✅") {
        el.toastText.textContent = message;
        el.toastIcon.textContent = icon;
        el.toastBox.classList.add("show");
        if (toastTimerId) clearTimeout(toastTimerId);
        toastTimerId = setTimeout(() => {
          el.toastBox.classList.remove("show");
        }, 2800);
      }

      // ==========================================================================
      // 6. 日數與日期輸入框渲染
      // ==========================================================================
      function syncDaysUI() {
        let val = parseInt(el.daysCountInput.value, 10);
        if (isNaN(val) || val < 1) val = 1;
        if (val > 10) val = 10;
        el.daysCountInput.value = val;
        state.daysCount = val;

        // 更新模式徽章
        el.modeBadge.textContent = val === 1 ? "單日排先後次序" : `分 ${val} 日平均匯報`;

        // 擴充或裁剪日期陣列
        while (state.dayDates.length < val) {
          state.dayDates.push(generateDefaultDateLabel(state.dayDates.length));
        }
        state.dayDates = state.dayDates.slice(0, val);

        // 若有學生鎖定在超過目前總日數的日子，自動重設為隨機
        state.students.forEach((stu) => {
          if (stu.lockedDay !== null && stu.lockedDay >= val) {
            stu.lockedDay = null;
          }
        });

        renderDayDatesInputs();
        renderPreAssignList();
      }

      function renderDayDatesInputs() {
        el.dayDatesContainer.innerHTML = "";
        for (let i = 0; i < state.daysCount; i++) {
          const row = document.createElement("div");
          row.className = "day-date-row";

          const tag = document.createElement("span");
          tag.className = "day-tag";
          tag.textContent = state.daysCount === 1 ? "匯報日" : `第 ${i + 1} 日`;

          const input = document.createElement("input");
          input.type = "text";
          input.className = "input-control";
          input.style.padding = "5px 9px";
          input.style.fontSize = "0.82rem";
          input.value = state.dayDates[i] || "";
          input.placeholder = `輸入第 ${i + 1} 日日期或備註`;
          input.addEventListener("input", (e) => {
            state.dayDates[i] = e.target.value;
          });

          row.appendChild(tag);
          row.appendChild(input);
          el.dayDatesContainer.appendChild(row);
        }
      }

      // ==========================================================================
      // 7. 學生名單解析與預先手動鎖定列表渲染
      // ==========================================================================
      function parseStudentsFromInput() {
        const raw = el.studentInput.value || "";
        // 支援換行、半形逗號、全形逗號、頓號分隔
        const names = raw
          .split(/[\n,，、]+/)
          .map((s) => s.trim())
          .filter((s) => s.length > 0);

        // 保留既有同名同順序學生的鎖定設定
        const oldStudents = state.students.slice();
        state.students = names.map((name, idx) => {
          const existingMatch = oldStudents.find((o, oIdx) => o.name === name && !o._matched && (oIdx === idx || true));
          let lockedDay = null;
          if (existingMatch) {
            existingMatch._matched = true;
            lockedDay = existingMatch.lockedDay;
          }
          if (lockedDay !== null && lockedDay >= state.daysCount) {
            lockedDay = null;
          }
          return {
            id: `stu_${idx}_${Math.random().toString(36).slice(2, 7)}`,
            name,
            lockedDay
          };
        });

        el.totalStudentCount.textContent = state.students.length;
        renderPreAssignList();
      }

      function renderPreAssignList() {
        if (state.students.length === 0) {
          el.preAssignSection.classList.add("hidden");
          return;
        }

        el.preAssignSection.classList.remove("hidden");
        const lockedTotal = state.students.filter((s) => s.lockedDay !== null).length;
        el.lockedCountBadge.textContent = `已鎖定 ${lockedTotal} 人`;

        el.preAssignList.innerHTML = "";
        state.students.forEach((stu, idx) => {
          const row = document.createElement("div");
          row.className = "preassign-row" + (stu.lockedDay !== null ? " is-locked" : "");

          const numSpan = document.createElement("span");
          numSpan.className = "stu-index";
          numSpan.textContent = `${idx + 1}.`;

          const nameSpan = document.createElement("span");
          nameSpan.className = "stu-name-label";
          nameSpan.textContent = stu.name;
          nameSpan.title = stu.name;

          const select = document.createElement("select");
          select.className = "lock-select";

          const optRandom = document.createElement("option");
          optRandom.value = "";
          optRandom.textContent = "🎲 隨機分配";
          select.appendChild(optRandom);

          for (let d = 0; d < state.daysCount; d++) {
            const optDay = document.createElement("option");
            optDay.value = String(d);
            optDay.textContent = state.daysCount === 1 ? "📌 鎖定參與" : `📌 鎖定第 ${d + 1} 日`;
            if (stu.lockedDay === d) {
              optDay.selected = true;
            }
            select.appendChild(optDay);
          }

          select.addEventListener("change", (e) => {
            const val = e.target.value;
            stu.lockedDay = val === "" ? null : parseInt(val, 10);
            renderPreAssignList();
          });

          row.appendChild(numSpan);
          row.appendChild(nameSpan);
          row.appendChild(select);
          el.preAssignList.appendChild(row);
        });
      }

      // ==========================================================================
      // 8. 核心平均分組與隨機次序演算法
      // ==========================================================================
      function computeBalancedSchedule() {
        const days = state.daysCount;
        const buckets = Array.from({ length: days }, () => []);

        // 1. 先放入預先手動鎖定的學生
        const unlockedStudents = [];
        state.students.forEach((stu) => {
          if (stu.lockedDay !== null && stu.lockedDay >= 0 && stu.lockedDay < days) {
            buckets[stu.lockedDay].push({ ...stu });
          } else {
            unlockedStudents.push({ ...stu });
          }
        });

        // 2. 將未鎖定的學生完全隨機打亂
        const shuffledUnlocked = shuffleArray(unlockedStudents);

        // 3. 計算每日目標名額
        const mode = el.distributionMode.value;
        const maxPerDay = Math.max(1, parseInt(el.maxPerDayInput.value, 10) || 10);

        if (mode === "capped") {
          // 優先填滿每日上限，若仍有剩餘則平均分配至所有日子
          for (const stu of shuffledUnlocked) {
            let targetDay = -1;
            let minCount = Infinity;
            for (let d = 0; d < days; d++) {
              if (buckets[d].length < maxPerDay && buckets[d].length < minCount) {
                minCount = buckets[d].length;
                targetDay = d;
              }
            }
            if (targetDay === -1) {
              // 所有日子皆達上限，改找目前人數最少的一日順延加入
              for (let d = 0; d < days; d++) {
                if (buckets[d].length < minCount) {
                  minCount = buckets[d].length;
                  targetDay = d;
                }
              }
            }
            buckets[targetDay].push(stu);
          }
        } else {
          // 自動平均分配：每次將學生放入目前人數最少的那一日（已計入預先鎖定人數）
          for (const stu of shuffledUnlocked) {
            let minCount = Infinity;
            let candidateDays = [];
            for (let d = 0; d < days; d++) {
              const len = buckets[d].length;
              if (len < minCount) {
                minCount = len;
                candidateDays = [d];
              } else if (len === minCount) {
                candidateDays.push(d);
              }
            }
            // 若有多日人數相同，隨機挑選其中一日以確保完全公平
            const chosenDay = candidateDays[Math.floor(Math.random() * candidateDays.length)];
            buckets[chosenDay].push(stu);
          }
        }

        // 4. 每一日內部的匯報先後次序亦完全隨機洗牌
        return buckets.map((dayGroup) => shuffleArray(dayGroup));
      }

      // ==========================================================================
      // 9. 三段式拉長緊張抽籤動畫流程 (約 4.8 秒)
      // ==========================================================================
      function startLotteryDraw() {
        if (state.students.length === 0) {
          showToast("請先輸入至少一位學生姓名", "⚠️");
          el.studentInput.focus();
          return;
        }

        if (state.isDrawing) return;
        state.isDrawing = true;

        el.startDrawBtn.disabled = true;
        el.redrawAllBtn.disabled = true;

        // 切換至抽籤舞台畫面
        el.emptyStateBox.classList.add("hidden");
        el.resultsGrid.classList.add("hidden");
        el.resultActionBtns.classList.add("hidden");
        el.lotteryStage.classList.remove("hidden");

        const totalDuration = 4800; // 4.8 秒拉長緊張過程
        const startTime = performance.now();

        // 啟動低音緊張懸疑聲效
        soundEngine.startTensionPad(totalDuration / 1000);

        if (drawTimerId) clearTimeout(drawTimerId);

        function stepAnimation() {
          const now = performance.now();
          const elapsed = now - startTime;
          const progress = Math.min(1, elapsed / totalDuration);
          const pct = Math.round(progress * 100);

          // 隨機挑選跳動顯示的同學與日數
          const randomStudent = state.students[Math.floor(Math.random() * state.students.length)];
          const randomDay = Math.floor(Math.random() * state.daysCount) + 1;

          el.slotNameDisplay.textContent = randomStudent.name;
          el.slotNameDisplay.classList.remove("pop");
          void el.slotNameDisplay.offsetWidth;
          el.slotNameDisplay.classList.add("pop");

          el.progressFill.style.width = `${pct}%`;
          el.progressPct.textContent = `${pct}%`;

          const isFinalCountdown = progress >= 0.76;

          if (progress < 0.45) {
            el.stagePhaseText.textContent = "隨機洗牌中...";
            el.progressHint.textContent = "打亂全部名單順序";
            el.slotSubDisplay.textContent = state.daysCount > 1
              ? `正在隨機分配 第 ${randomDay} 日 匯報人選...`
              : "正在洗牌匯報先後次序...";
            el.slotBox.classList.remove("final-tension");
          } else if (!isFinalCountdown) {
            el.stagePhaseText.textContent = "第二階段：鎖定各日名額與次序...";
            el.progressHint.textContent = "轉盤逐漸減速，緊張時刻來臨！";
            el.slotSubDisplay.textContent = state.daysCount > 1
              ? `即將鎖定 第 ${randomDay} 日 序列...`
              : "即將鎖定最終次序...";
            el.slotBox.classList.remove("final-tension");
          } else {
            el.stagePhaseText.textContent = "🔥 最後倒數！即將揭曉！";
            el.progressHint.textContent = "屏息以待！";
            el.slotSubDisplay.textContent = "正在鎖定最終排程表...";
            el.slotBox.classList.add("final-tension");
          }

          // 播放對應速度與音調的嘀嗒/小鼓音效
          soundEngine.playTick(progress, isFinalCountdown);

          if (elapsed < totalDuration) {
            let nextInterval;
            if (progress < 0.45) {
              // 前段高速滾動 (45ms ~ 70ms)
              nextInterval = 45 + (progress / 0.45) * 25;
            } else if (progress < 0.76) {
              // 中段明顯減速 (80ms ~ 220ms)
              const subP = (progress - 0.45) / 0.31;
              nextInterval = 80 + Math.pow(subP, 1.5) * 140;
            } else {
              // 後段慢動作最後幾下重音倒數 (250ms ~ 470ms)
              const subP = (progress - 0.76) / 0.24;
              nextInterval = 250 + subP * 220;
            }
            drawTimerId = setTimeout(stepAnimation, nextInterval);
          } else {
            // 最後戲劇性停頓 220ms 後揭曉
            drawTimerId = setTimeout(finalizeLotteryDraw, 220);
          }
        }

        stepAnimation();
      }

      function finalizeLotteryDraw() {
        state.schedule = computeBalancedSchedule();
        state.isDrawing = false;

        el.startDrawBtn.disabled = false;
        el.redrawAllBtn.disabled = false;

        // 播放盛大揭曉和弦音效
        soundEngine.playRevealFanfare();

        el.lotteryStage.classList.add("hidden");
        el.resultsGrid.classList.remove("hidden");
        el.resultActionBtns.classList.remove("hidden");

        const lockedCount = state.students.filter((s) => s.lockedDay !== null).length;
        el.resultSubtitle.textContent = state.daysCount === 1
          ? `共 ${state.students.length} 位同學，已完成單日匯報先後次序抽籤`
          : `共 ${state.students.length} 位同學，平均分為 ${state.daysCount} 日匯報（含 ${lockedCount} 位預先指定）`;

        renderResultsGrid();
        showToast("抽籤分配結果已正式揭曉！", "🎉");
      }

      // ==========================================================================
      // 10. 結果卡片渲染與課堂順序微調
      // ==========================================================================
      function renderResultsGrid() {
        el.resultsGrid.innerHTML = "";

        state.schedule.forEach((dayStudents, dayIdx) => {
          const card = document.createElement("article");
          card.className = "day-card";
          card.style.animationDelay = `${dayIdx * 0.07}s`;

          // 卡片標頭
          const header = document.createElement("div");
          header.className = "day-card-header";

          const titleWrap = document.createElement("div");
          const title = document.createElement("div");
          title.className = "day-card-title";
          title.textContent = state.daysCount === 1 ? "📅 匯報先後次序表" : `📅 第 ${dayIdx + 1} 日`;

          const dateSub = document.createElement("div");
          dateSub.className = "day-card-date";
          dateSub.textContent = state.dayDates[dayIdx] || "未設定日期備註";

          titleWrap.appendChild(title);
          titleWrap.appendChild(dateSub);

          const actionsWrap = document.createElement("div");
          actionsWrap.className = "day-card-actions";

          const countPill = document.createElement("span");
          countPill.className = "day-count-pill";
          countPill.textContent = `${dayStudents.length} 人`;

          const reshuffleBtn = document.createElement("button");
          reshuffleBtn.type = "button";
          reshuffleBtn.className = "btn-reshuffle-day";
          reshuffleBtn.textContent = "🔄 重洗次序";
          reshuffleBtn.title = "僅重新打亂本日同學的先後順序";
          reshuffleBtn.addEventListener("click", () => {
            if (state.schedule[dayIdx].length <= 1) return;
            state.schedule[dayIdx] = shuffleArray(state.schedule[dayIdx]);
            soundEngine.playQuickShuffle();
            renderResultsGrid();
            showToast(`已重新洗牌「第 ${dayIdx + 1} 日」的先後次序`, "🔄");
          });

          actionsWrap.appendChild(countPill);
          actionsWrap.appendChild(reshuffleBtn);

          header.appendChild(titleWrap);
          header.appendChild(actionsWrap);
          card.appendChild(header);

          // 學生名單列表
          const list = document.createElement("div");
          list.className = "student-order-list";

          if (dayStudents.length === 0) {
            const emptyMsg = document.createElement("div");
            emptyMsg.style.padding = "24px 12px";
            emptyMsg.style.textAlign = "center";
            emptyMsg.style.color = "var(--text-muted)";
            emptyMsg.style.fontSize = "0.85rem";
            emptyMsg.textContent = "本日暫無安排學生";
            list.appendChild(emptyMsg);
          } else {
            dayStudents.forEach((stu, orderIdx) => {
              const item = document.createElement("div");
              item.className = "order-item" + (stu.lockedDay !== null ? " locked-item" : "");

              const left = document.createElement("div");
              left.className = "order-left";

              const numBadge = document.createElement("span");
              numBadge.className = "order-num";
              numBadge.textContent = String(orderIdx + 1);

              const nameEl = document.createElement("span");
              nameEl.className = "order-name";
              nameEl.textContent = stu.name;

              left.appendChild(numBadge);
              left.appendChild(nameEl);

              if (stu.lockedDay !== null) {
                const lockBadge = document.createElement("span");
                lockBadge.className = "locked-tag";
                lockBadge.textContent = "📌 指定";
                left.appendChild(lockBadge);
              }

              // 上下微調按鈕
              const controls = document.createElement("div");
              controls.className = "order-controls";

              const upBtn = document.createElement("button");
              upBtn.type = "button";
              upBtn.className = "btn-move";
              upBtn.textContent = "↑";
              upBtn.title = "向上移一位";
              upBtn.disabled = orderIdx === 0;
              upBtn.addEventListener("click", () => {
                if (orderIdx > 0) {
                  const arr = state.schedule[dayIdx];
                  [arr[orderIdx - 1], arr[orderIdx]] = [arr[orderIdx], arr[orderIdx - 1]];
                  renderResultsGrid();
                }
              });

              const downBtn = document.createElement("button");
              downBtn.type = "button";
              downBtn.className = "btn-move";
              downBtn.textContent = "↓";
              downBtn.title = "向下移一位";
              downBtn.disabled = orderIdx === dayStudents.length - 1;
              downBtn.addEventListener("click", () => {
                if (orderIdx < dayStudents.length - 1) {
                  const arr = state.schedule[dayIdx];
                  [arr[orderIdx + 1], arr[orderIdx]] = [arr[orderIdx], arr[orderIdx + 1]];
                  renderResultsGrid();
                }
              });

              controls.appendChild(upBtn);
              controls.appendChild(downBtn);

              item.appendChild(left);
              item.appendChild(controls);
              list.appendChild(item);
            });
          }

          card.appendChild(list);
          el.resultsGrid.appendChild(card);
        });
      }

      // ==========================================================================
      // 11. 複製文字與匯出 CSV 功能 (支援 iFrame 安全複製)
      // ==========================================================================
      function copyResultsToClipboard() {
        if (!state.schedule || state.schedule.length === 0) return;

        const lines = ["【學生匯報抽籤結果】", ""];
        state.schedule.forEach((group, dIdx) => {
          const dayHeader = state.daysCount === 1
            ? `◆ 匯報日期 (${state.dayDates[dIdx] || ""}) - 共 ${group.length} 人`
            : `◆ 第 ${dIdx + 1} 日 (${state.dayDates[dIdx] || ""}) - 共 ${group.length} 人`;
          lines.push(dayHeader);
          group.forEach((stu, sIdx) => {
            const lockNote = stu.lockedDay !== null ? " [預先指定]" : "";
            lines.push(`  ${sIdx + 1}. ${stu.name}${lockNote}`);
          });
          lines.push("");
        });

        const text = lines.join("\n");
        const tempArea = document.createElement("textarea");
        tempArea.value = text;
        tempArea.style.position = "fixed";
        tempArea.style.opacity = "0";
        document.body.appendChild(tempArea);
        tempArea.select();
        try {
          document.execCommand("copy");
          showToast("已複製結果", "📋");
        } catch (err) {
          showToast("複製失敗，請手動選取文字複製", "⚠️");
        }
        document.body.removeChild(tempArea);
      }

      function exportScheduleCSV() {
        if (!state.schedule || state.schedule.length === 0) return;

        const rows = [["匯報日次", "日期備註", "匯報次序", "學生姓名", "分配方式"]];
        state.schedule.forEach((group, dIdx) => {
          const dayName = state.daysCount === 1 ? "第 1 日" : `第 ${dIdx + 1} 日`;
          const dateNote = (state.dayDates[dIdx] || "").replace(/,/g, " ");
          group.forEach((stu, sIdx) => {
            rows.push([
              dayName,
              dateNote,
              String(sIdx + 1),
              stu.name.replace(/,/g, " "),
              stu.lockedDay !== null ? "預先指定" : "隨機抽籤"
            ]);
          });
        });

        // 加入 UTF-8 BOM 確保 Excel 開啟中文不亂碼
        const csvContent = "\uFEFF" + rows.map((r) => r.join(",")).join("\n");
        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `學生匯報抽籤結果_${new Date().toISOString().slice(0, 10)}.csv`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        showToast("已匯出 Excel 相容 CSV 檔案", "📥");
      }

      // ==========================================================================
      // 12. 事件綁定與初始化 (DOMContentLoaded)
      // ==========================================================================
      function bindEvents() {
        // 音效開關與試音
        el.soundToggleBtn.addEventListener("click", () => {
          state.soundEnabled = !state.soundEnabled;
          if (state.soundEnabled) {
            el.soundToggleBtn.className = "btn-header sound-active";
            el.soundIcon.textContent = "🔊";
            el.soundLabel.textContent = "音效開啟";
            soundEngine.playTick(0.8, false);
            showToast("開啟音效", "🔊");
          } else {
            soundEngine.stopTensionPad();
            el.soundToggleBtn.className = "btn-header sound-muted";
            el.soundIcon.textContent = "🔇";
            el.soundLabel.textContent = "靜音模式";
            showToast("已切換為靜音模式", "🔇");
          }
        });

        // 投影模式（隱藏/顯示左側設定欄）
        el.toggleSidebarBtn.addEventListener("click", () => {
          state.isSidebarHidden = !state.isSidebarHidden;
          if (state.isSidebarHidden) {
            el.settingsSidebar.classList.add("hidden");
            el.sidebarToggleText.textContent = "顯示設定欄";
          } else {
            el.settingsSidebar.classList.remove("hidden");
            el.sidebarToggleText.textContent = "全螢幕";
          }
        });

        // 匯報日數調整
        el.decDaysBtn.addEventListener("click", () => {
          el.daysCountInput.value = Math.max(1, (parseInt(el.daysCountInput.value, 10) || 1) - 1);
          syncDaysUI();
        });

        el.incDaysBtn.addEventListener("click", () => {
          el.daysCountInput.value = Math.min(10, (parseInt(el.daysCountInput.value, 10) || 1) + 1);
          syncDaysUI();
        });

        el.daysCountInput.addEventListener("change", syncDaysUI);

        // 分配策略切換
        el.distributionMode.addEventListener("change", () => {
          if (el.distributionMode.value === "capped") {
            el.maxCapBox.classList.remove("hidden");
          } else {
            el.maxCapBox.classList.add("hidden");
          }
        });

        // 學生名單操作
        el.studentInput.addEventListener("input", parseStudentsFromInput);

        el.loadSampleBtn.addEventListener("click", () => {
          el.studentInput.value = SAMPLE_STUDENTS.join("\n");
          parseStudentsFromInput();
          showToast("已載入 24 位學生示例名單", "👥");
        });

        el.clearStudentsBtn.addEventListener("click", () => {
          el.studentInput.value = "";
          state.students = [];
          parseStudentsFromInput();
          showToast("已清空學生名單", "🗑️");
        });

        // 抽籤與匯出按鈕
        el.startDrawBtn.addEventListener("click", startLotteryDraw);
        el.redrawAllBtn.addEventListener("click", startLotteryDraw);
        el.quickDemoBtn.addEventListener("click", () => {
          if (state.students.length === 0) {
            el.studentInput.value = SAMPLE_STUDENTS.join("\n");
            parseStudentsFromInput();
          }
          startLotteryDraw();
        });
        el.copyResultsBtn.addEventListener("click", copyResultsToClipboard);
        el.exportCsvBtn.addEventListener("click", exportScheduleCSV);
      }

      function initApp() {
        bindEvents();
        syncDaysUI();
        // 預設預載 24 位學生範例方便立即體驗
        el.studentInput.value = SAMPLE_STUDENTS.join("\n");
        parseStudentsFromInput();
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initApp);
      } else {
        initApp();
      }
    })();
  </script>
</body>
